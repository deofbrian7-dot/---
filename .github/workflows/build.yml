
name: BIAN AI APK Builder

on:
  workflow_dispatch:
  push:
    paths:
      - 'bian-ai-android.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Extract Android Project
        run: |
          mkdir app
          unzip -o bian-ai-android.zip -d app

      - name: Install Dependencies
        run: |
          cd app
          npm install
          npx cap add android

      - name: Build APK
        run: |
          cd app
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BIAN-AI-APK
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
